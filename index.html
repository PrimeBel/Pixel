<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#242629">
<title>PIXEL — Магазин</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#242629;color:#f1f1f1;font-family:Arial,sans-serif}
header{background:#191a1c;padding:23px 18px 25px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}
.logo span{color:#b6f36b}
.sub{color:#999;font-size:13px;margin-top:5px}
.cart-btn{background:#b6f36b;border:0;border-radius:14px;padding:13px 16px;font-weight:bold}
.search{margin-top:20px;width:100%;padding:16px;border:1px solid #505257;border-radius:14px;font-size:16px;background:#35373a;color:white}
.search::placeholder{color:#aaa}
main{padding:20px 15px 120px;max-width:750px;margin:auto}
h2{font-size:21px;margin:25px 0 15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding-bottom:7px}
.cat{border:1px solid #45474a;background:#35373a;color:#eee;padding:12px 17px;border-radius:30px;white-space:nowrap}
.cat.active{background:#eee;color:#191919}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.product{background:#333538;border-radius:17px;overflow:hidden;position:relative;box-shadow:0 4px 14px #0003}
.product img{width:100%;height:155px;object-fit:cover;background:#45474a}
.no-image{height:155px;display:flex;align-items:center;justify-content:center;background:#35373a;color:#999;font-size:38px}
.info{padding:12px}
.name{font-weight:bold;font-size:16px}
.desc{font-size:13px;color:#aaa;margin-top:6px;line-height:1.4}
.price{font-weight:bold;margin-top:11px;font-size:16px}
.old{font-size:12px;color:#999;text-decoration:line-through;margin-left:5px;font-weight:normal}
.discount{position:absolute;top:9px;left:9px;background:#b6f36b;color:#171717;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:bold}
.add{width:100%;margin-top:12px;border:0;background:#e5e5e5;color:#171717;padding:12px 5px;border-radius:11px;font-weight:bold}
.add:disabled{opacity:.5}
.empty{color:#aaa;font-size:14px;grid-column:1/-1}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#191a1c;padding:13px 16px calc(13px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px #0005;display:flex;justify-content:space-between;align-items:center;z-index:3}
.bottom button{background:#e5e5e5;color:#171717;border:0;padding:14px 18px;border-radius:13px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:flex-end}
.panel{background:#292b2e;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 17px calc(25px + env(safe-area-inset-bottom))}
.panel h2{margin-top:5px}
.close{float:right;border:0;background:#414347;color:white;border-radius:50%;width:36px;height:36px;font-size:20px}
.cart-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #45474a;padding:13px 0;font-size:14px}
.qty{display:flex;align-items:center;gap:12px;margin-top:9px}
.qty button{border:0;background:#45474a;color:white;border-radius:8px;padding:6px 12px}
.total{font-size:19px;font-weight:bold;margin:18px 0}
.notice{font-size:12px;color:#aaa;line-height:1.5;margin-top:15px}
.primary{width:100%;border:0;background:#b6f36b;color:#171717;padding:15px;border-radius:12px;font-weight:bold;font-size:16px;margin-top:12px}
.primary:disabled{opacity:.55}
.checkout{display:none;margin-top:22px;border-top:1px solid #45474a;padding-top:10px}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:13px;color:#c7c7c7;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:14px;border:1px solid #505257;border-radius:11px;background:#35373a;color:white;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.status{font-size:14px;line-height:1.5;margin-top:14px}
.status.error{color:#ff9b9b}
.status.success{color:#b6f36b}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<body>

<header>
 <div class="top">
  <div>
   <div class="logo">PIXEL<span>.</span></div>
   <div class="sub">ТВОЙ МАГАЗИН В TELEGRAM</div>
  </div>
  <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
 </div>
 <input class="search" id="search" placeholder="Поиск товаров...">
</header>

<main>
 <h2>Категории</h2>
 <div class="categories" id="categories"></div>

 <h2 id="sectionTitle">Популярные товары</h2>
 <div class="grid" id="products">
  <p class="empty">Загружаем товары...</p>
 </div>
</main>

<div class="bottom">
 <div>
  <small>Ваша корзина</small><br>
  <b id="bottomTotal">0,00 BYN</b>
 </div>
 <button onclick="openCart()">Открыть корзину →</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeCart()">
 <div class="panel">
  <button class="close" onclick="closeCart()">×</button>
  <h2>🛒 Корзина</h2>

  <div id="cartItems"></div>
  <div class="total" id="cartTotal">Итого: 0,00 BYN</div>

  <button class="primary" id="checkoutStart" type="button" onclick="showCheckout()">
   Перейти к оформлению
  </button>

  <form class="checkout" id="checkoutForm">
   <h2>Оформление заказа</h2>

   <label class="field">
    <span>Ваше имя *</span>
    <input name="buyer_name" required minlength="2" maxlength="100"
     autocomplete="name" placeholder="Как к вам обращаться">
   </label>

   <label class="field">
    <span>Телефон или Telegram *</span>
    <input name="contact" required minlength="3" maxlength="100"
     autocomplete="tel" placeholder="+375... или @username">
   </label>

   <label class="field">
    <span>Способ оплаты *</span>
    <select name="payment_method" required>
     <option value="">Выберите способ оплаты</option>
     <option>Наличными при получении</option>
     <option>Перевод на карту</option>
     <option>Другой способ</option>
    </select>
   </label>

   <label class="field">
    <span>Адрес доставки / место получения *</span>
    <textarea name="delivery_address" required minlength="3" maxlength="500"
     placeholder="Укажите адрес или удобное место получения"></textarea>
   </label>

   <label class="field">
    <span>Комментарий к заказу</span>
    <textarea name="customer_comment" maxlength="1000"
     placeholder="Размер, цвет, пожелания (если есть)"></textarea>
   </label>

   <button class="primary" id="submitOrder" type="submit">
    Подтвердить заказ
   </button>

   <div id="orderStatus" class="status" role="status" aria-live="polite"></div>

   <p class="notice">
    Итоговая стоимость и наличие товаров проверяются при оформлении заказа.
   </p>
  </form>

  <p class="notice" id="cartHint">
   Количество товаров можно изменить кнопками + и −.
  </p>
 </div>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://iuodcfroelueapetggog.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9oJI3ki12TygVlpMwPSZ6Q_NyTby9q7';
const ORDER_URL = SUPABASE_URL + '/functions/v1/place-order';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let selected = 'Все';
let cart = {};

const money = n =>
 Number(n).toFixed(2).replace('.', ',') + ' BYN';

function safe(value){
 return String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 })[c]);
}

function finalPrice(p){
 return Number(p.price) *
 (1 - Number(p.discount_percent || 0) / 100);
}

async function loadProducts(){
 const box = document.getElementById('products');
 box.innerHTML = '<p class="empty">Загружаем товары...</p>';

 try{
  const {data:cats,error:catError} = await db
   .from('categories')
   .select('id,name')
   .eq('is_active',true);

  if(catError) throw catError;

  const {data,error} = await db
   .from('products')
   .select('id,category_id,name,description,image_url,price,discount_percent,stock')
   .eq('is_active',true)
   .gt('stock',0)
   .order('sort_order');

  if(error) throw error;

  const categoryMap = Object.fromEntries(
   (cats || []).map(c => [c.id,c.name])
  );

  products = (data || []).map(p => ({
   ...p,
   category:categoryMap[p.category_id] || 'Без категории'
  }));

  render();

 }catch(error){
  console.error('Supabase:',error);
  box.innerHTML =
   '<p class="empty">Ошибка загрузки товаров. Попробуйте обновить страницу.</p>';
 }
}

function categories(){
 const names = ['Все',...new Set(products.map(p => p.category))];

 document.getElementById('categories').innerHTML = names.map(n =>
  `<button class="cat ${selected===n?'active':''}"
   data-category="${safe(n)}">${safe(n)}</button>`
 ).join('');

 document.querySelectorAll('[data-category]').forEach(button => {
  button.addEventListener('click',() => {
   selected = button.dataset.category;
   render();
  });
 });
}

function render(){
 categories();

 const q = document.getElementById('search').value.toLowerCase();

 const items = products.filter(p =>
  (selected==='Все' || p.category===selected) &&
  (p.name || '').toLowerCase().includes(q)
 );

 document.getElementById('sectionTitle').textContent =
  selected==='Все' ? 'Популярные товары' : selected;

 document.getElementById('products').innerHTML = items.map(p => {
  const price = finalPrice(p);
  const discount = Number(p.discount_percent || 0);
  const image = /^https:\/\//i.test(p.image_url || '');

  return `<div class="product">
   ${discount>0
    ? `<span class="discount">-${Math.round(discount)}%</span>`
    : ''}
   ${image
    ? `<img src="${safe(p.image_url)}" alt="${safe(p.name)}"
         onerror="this.style.display='none'">`
    : '<div class="no-image">🛍️</div>'}
   <div class="info">
    <div class="name">${safe(p.name)}</div>
    <div class="desc">${safe(p.description || '')}</div>
    <div class="price">
     ${money(price)}
     ${discount>0
      ? `<span class="old">${money(p.price)}</span>`
      : ''}
    </div>
    <button class="add" data-add="${safe(p.id)}">
     Добавить в корзину
    </button>
   </div>
  </div>`;
 }).join('') || '<p class="empty">Товаров пока нет</p>';

 document.querySelectorAll('[data-add]').forEach(button => {
  button.addEventListener('click',() => add(button.dataset.add));
 });

 updateCart();
}

function add(id){
 const p = products.find(x => x.id===id);
 if(!p) return;

 if((cart[id] || 0)>=Number(p.stock)){
  alert('Больше товара нет в наличии');
  return;
 }

 cart[id] = (cart[id] || 0)+1;
 updateCart();
}

function change(id,n){
 const p = products.find(x => x.id===id);
 if(!p) return;

 cart[id] = (cart[id] || 0)+n;

 if(cart[id]<=0) delete cart[id];
 if(cart[id]>Number(p.stock)) cart[id]=Number(p.stock);

 updateCart();
}

function total(){
 return products.reduce(
  (sum,p) => sum+finalPrice(p)*(cart[p.id] || 0),0
 );
}

function count(){
 return Object.values(cart).reduce((a,b)=>a+b,0);
}

function updateCart(){
 document.getElementById('cartCount').textContent=count();
 document.getElementById('bottomTotal').textContent=money(total());
 document.getElementById('cartTotal').textContent='Итого: '+money(total());

 const chosen=products.filter(p=>cart[p.id]);

 document.getElementById('cartItems').innerHTML=count()
  ? chosen.map(p=>`
    <div class="cart-line">
     <div>
      <b>${safe(p.name)}</b><br>${money(finalPrice(p))}
      <div class="qty">
       <button type="button" data-change="${safe(p.id)}" data-delta="-1">−</button>
       ${cart[p.id]}
       <button type="button" data-change="${safe(p.id)}" data-delta="1">+</button>
      </div>
     </div>
     <b>${money(finalPrice(p)*cart[p.id])}</b>
    </div>
   `).join('')
  : '<p class="empty">Корзина пока пуста</p>';

 document.querySelectorAll('[data-change]').forEach(button=>{
  button.addEventListener('click',()=>{
   change(button.dataset.change,Number(button.dataset.delta));
  });
 });

 document.getElementById('checkoutStart').style.display =
  count() ? 'block' : 'none';

 if(!count()){
  document.getElementById('checkoutForm').style.display='none';
 }
}

function openCart(){
 document.getElementById('modal').style.display='flex';
 updateCart();
}

function closeCart(){
 document.getElementById('modal').style.display='none';
}

function showCheckout(){
 if(!count()){
  alert('Сначала добавьте товары в корзину');
  return;
 }

 document.getElementById('checkoutForm').style.display='block';

 document.getElementById('checkoutForm').scrollIntoView({
  behavior:'smooth',
  block:'start'
 });
}

window.openCart=openCart;
window.closeCart=closeCart;
window.showCheckout=showCheckout;

document.getElementById('search').addEventListener('input',render);

document.getElementById('checkoutForm').addEventListener('submit',async event=>{
 event.preventDefault();

 const form=event.currentTarget;
 const button=document.getElementById('submitOrder');
 const status=document.getElementById('orderStatus');

 if(!count()){
  status.textContent='Корзина пуста.';
  status.className='status error';
  return;
 }

 const data=new FormData(form);

 const payload={
  buyer_name:String(data.get('buyer_name') || '').trim(),
  contact:String(data.get('contact') || '').trim(),
  payment_method:String(data.get('payment_method') || '').trim(),
  delivery_address:String(data.get('delivery_address') || '').trim(),
  customer_comment:String(data.get('customer_comment') || '').trim(),
  items:Object.entries(cart).map(([product_id,quantity])=>({
   product_id,
   quantity
  }))
 };

 button.disabled=true;
 button.textContent='Отправляем заказ...';

 status.textContent='Проверяем наличие и оформляем заказ. Не закрывайте страницу.';
 status.className='status';

 try{
  const response=await fetch(ORDER_URL,{
   method:'POST',
   headers:{
    'Content-Type':'application/json',
    'apikey':SUPABASE_KEY
   },
   body:JSON.stringify(payload)
  });

  const result=await response.json().catch(()=>({}));

  if(!response.ok || !result.ok){
   throw new Error(
    result.error || 'Не удалось оформить заказ. Попробуйте ещё раз.'
   );
  }

  cart={};
  form.reset();

  document.getElementById('checkoutForm').style.display='none';
  document.getElementById('checkoutStart').style.display='none';

  status.className='status success';
  status.textContent='';

  const note=result.notification_sent
   ? 'Уведомление продавцу отправлено.'
   : (result.notification_configured
      ? 'Заказ создан, но уведомление продавцу не отправилось. Продавцу нужно проверить Telegram.'
      : 'Заказ создан. Уведомления продавцу пока не настроены.');

  document.getElementById('cartItems').innerHTML=
   `<p class="status success">
    <b>Заказ успешно оформлен!</b><br>
    Номер заказа: ${safe(result.order_id)}<br>
    Сумма: ${money(result.total)}<br>
    ${safe(note)}
   </p>`;

  document.getElementById('cartTotal').textContent='Заказ принят';
  document.getElementById('cartHint').textContent=
   'Спасибо за покупку! Продавец свяжется с вами.';

  await loadProducts();

 }catch(error){
  status.textContent=error.message ||
   'Ошибка соединения. Проверьте интернет и попробуйте снова.';
  status.className='status error';

 }finally{
  button.disabled=false;
  button.textContent='Подтвердить заказ';
 }
});

loadProducts();
</script>

</body>
</html>
